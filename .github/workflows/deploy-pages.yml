name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build static site
        run: npm run build
      - name: Match asset paths to the /stocksearch/ site root
        # vinext emits assets into the assetPrefix directory (dist/client/stocksearch/_next),
        # but the artifact is already served from /stocksearch/, so the URLs in index.html
        # (/stocksearch/_next/...) resolve to the artifact root. Move the assets up one level.
        run: |
          if [ -d dist/client/stocksearch/_next ]; then
            mv dist/client/stocksearch/_next dist/client/_next
            rmdir dist/client/stocksearch
          fi
          test -f dist/client/index.html
          test -d dist/client/_next
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
